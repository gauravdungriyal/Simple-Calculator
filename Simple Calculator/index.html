<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="position: fixed; top: 5%;color: black;border: 10px solid white;padding: 10px;margin: 1px;">Calculator</h1>
    <div class="container">
        <i class="fa-solid fa-square-xmark clear"></i>
        <h4 class="main-input"></h4>
        <p class="input-num">7</p>
        <p class="input-num">8</p>
        <p class="input-num">9</p>
        <p class="input-num">+</p>
        <p class="input-num">4</p>
        <p class="input-num">5</p>
        <p class="input-num">6</p>
        <p class="input-num">-</p>
        <p class="input-num">1</p>
        <p class="input-num">2</p>
        <p class="input-num">3</p>
        <p class="input-num">/</p>
        <p class="input-num">0</p>
        <p class="input-num">.</p>
        <p class="input-num result">=</p>
        <p class="input-num">*</p>

    </div>
    <script src="script.js"></script>
</body>
</html>
